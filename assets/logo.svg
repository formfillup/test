<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3264 924" role="img" aria-label="Talent Zone">
  <defs>
    <linearGradient id="tzBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A8CFF"/>
      <stop offset="55%" stop-color="#1E5EFF"/>
      <stop offset="100%" stop-color="#0B1F4D"/>
    </linearGradient>
    <linearGradient id="tzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>
  </defs>

  <!-- Emblem: hexagon "node" representing a talent facet -->
  <g transform="translate(462,462)">
    <polygon points="0,-260 225,-130 225,130 0,260 -225,130 -225,-130" fill="url(#tzBlue)"/>
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="#FFFFFF" opacity="0.14"/>
    <!-- spark / ascent mark -->
    <path d="M -95 70 L -25 -10 L 30 45 L 120 -95" fill="none" stroke="url(#tzGold)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="-95" r="26" fill="url(#tzGold)"/>
  </g>

  <!-- Orbit ring accent -->
  <circle cx="462" cy="462" r="320" fill="none" stroke="#1E5EFF" stroke-width="6" opacity="0.25"/>

  <!-- Ascending growth bars, spread across the wide canvas -->
  <g fill="url(#tzBlue)">
    <rect x="980" y="562" width="90" height="200" rx="20"/>
    <rect x="1110" y="462" width="90" height="300" rx="20"/>
    <rect x="1240" y="342" width="90" height="420" rx="20"/>
    <rect x="1370" y="222" width="90" height="540" rx="20"/>
  </g>

  <!-- Trailing facet dots representing a network of learners -->
  <g fill="#1E5EFF">
    <circle cx="1620" cy="462" r="22" opacity="0.9"/>
    <circle cx="1700" cy="380" r="16" opacity="0.6"/>
    <circle cx="1700" cy="544" r="16" opacity="0.6"/>
    <circle cx="1770" cy="462" r="11" opacity="0.4"/>
  </g>
</svg>
